# PR마다 전체 테스트와 패키지 설치를 확인해 결과를 PR에 표시한다 (진행도 mj-09, dh-19).
# 테스트는 fixture만 쓰고 학교 사이트에 요청하지 않으며, 비밀값을 쓰지 않는다.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: 전체 테스트
        run: python -m pytest tests/ -q
      - name: 패키지 설치 확인
        # 리포 밖 폴더에서 설치된 패키지로 import와 전체 테스트가 되는지 본다(진행도 dh-19).
        run: |
          python -m pip install .
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -c "import tools; assert 'site-packages' in tools.__file__, tools.__file__"
          python -m pytest tests/ -q
