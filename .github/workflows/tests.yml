# PR마다 전체 테스트를 돌려 결과를 PR에 표시한다 (진행도 mj-09).
# 테스트는 fixture만 쓰고 학교 사이트에 요청하지 않으며, 비밀값을 쓰지 않는다.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: 전체 테스트
        run: python -m pytest tests/ -q
